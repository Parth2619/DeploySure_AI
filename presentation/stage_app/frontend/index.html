<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>PriceRight</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>PriceRight</h1>
  <p>Work out the price after a discount.</p>
  <label>Price <input id="price" type="number" value="200" min="0" step="0.01"></label>
  <label>Discount (%) <input id="discount" type="number" value="10" min="0" max="100" step="1"></label>
  <button id="quote">Calculate price</button>
  <p id="error" role="alert"></p>
  <p id="result"></p>
  <script src="app.js"></script>
</body>
</html>
