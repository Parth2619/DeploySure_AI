server {
    listen 80 default_server;
    server_name _;

    auth_basic "DeploySure";
    auth_basic_user_file /etc/nginx/deploysure.htpasswd;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1;   # the app only accepts localhost names, so nginx presents one
        proxy_buffering off;               # the analysis streams its progress live (server-sent events)
        proxy_read_timeout 3600s;
    }
}
